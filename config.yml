# arXiv Daily Podcast 配置文件
# 所有参数都有默认值，如果不需要修改可以保持注释状态

# ==================== 输入源配置 ====================
# 可以启用多种输入方式，程序会合并所有来源的论文

input:
  # 从 Huggingface 爬取每日论文
  daily:
    enabled: true
    limit: 3  # 保留前 N 篇论文

  # 从文件读取 URL 列表
  file:
    enabled: false
    path: "test_urls.txt"  # 文件路径（每行一个 arXiv URL）

  # 直接输入 arXiv 链接
  arxiv:
    enabled: false
    urls: []  # 例如: ["https://arxiv.org/abs/2310.08560", "https://arxiv.org/abs/2312.00752"]

# ==================== 输出配置 ====================
output:
  dir: "output"  # 输出目录，会自动创建时间戳子文件夹
  pdf_dir: "pdfs"  # PDF 临时保存目录（处理完会自动删除）

# ==================== 模型配置 ====================
models:
  # 播客生成模型（需支持 PDF 文件输入）
  # 可选: gpt-4.1-mini, gpt-5.2, gpt-5.2-high, gemini-3-pro-preview, gemini-2.5-flash
  # 推荐: gemini-3-pro-preview（经测试效果最佳）
  podcast_model: "gemini-3-pro-preview"

  # 概览图识别模型（需支持图片输入）
  # 可选: gpt-4.1-mini, gpt-4o, gemini-3-pro-preview, Qwen/Qwen3-VL-235B-A22B-Instruct
  # 推荐: gemini-3-pro-preview（与播客模型使用相同模型，效果统一且稳定）
  grounding_model: "gemini-3-pro-preview"

  # 备用组合（使用专业视觉模型）:
  # podcast_model: "gemini-3-pro-preview"
  # grounding_model: "Qwen/Qwen3-VL-235B-A22B-Instruct"

# ==================== Prompt 配置 ====================
prompt:
  # 自定义播客生成 prompt 文件路径（可选）
  # 如果不指定，将使用默认的播客生成 prompt
  custom_file: "prompts/gpt5_podcast_prompt.txt"  # 针对 GPT-5.2 优化的提示词

  # 自定义概览图识别 prompt 文件路径（可选）
  # 如果不指定，将使用默认的 grounding prompt
  grounding_file: "prompts/gpt5_grounding_prompt.txt"  # 针对 GPT-5.2 优化的 grounding 提示词

# ==================== 性能配置 ====================
performance:
  max_workers: 5  # 最大并行处理数量（建议 3-10）
  max_pages: 5    # 搜索概览图的最大页数

# ==================== 日志配置 ====================
logging:
  dir: "logs"  # 日志目录
  level: "INFO"  # 日志级别: DEBUG, INFO, WARNING, ERROR
